catalogMode: prefer
minimumReleaseAge: 0
shellEmulator: true
trustPolicy: no-downgrade
# NOTICE:
# `@nolebase/*@2.21.0` was published without a provenance attestation while `2.18.2` had one,
# so `trustPolicy: no-downgrade` rejects it as a possible takeover (ERR_PNPM_TRUST_DOWNGRADE).
# The maintainer confirmed the release; it was published outside the provenance-enabled release CI.
# Removal condition: a `@nolebase/*` release with provenance is published and the catalog points to it.
trustPolicyExclude:
  - '@nolebase/ui@2.21.0'
  - '@nolebase/vitepress-plugin-git-changelog@2.21.0'
packages:
  - docs
  - packages/**
  - evals/**
  - examples/**
  - '!**/dist/**'
overrides:
  array-flatten: npm:@nolyfill/array-flatten@^1.0.44
  axios: npm:feaxios@^0.0.23
  is-core-module: npm:@nolyfill/is-core-module@^1.0.39
  isarray: npm:@nolyfill/isarray@^1.0.44
  onnxruntime-web: npm:onnxruntime-web@^1.27.0
  safe-buffer: npm:@nolyfill/safe-buffer@^1.0.44
  safer-buffer: npm:@nolyfill/safer-buffer@^1.0.44
  side-channel: npm:@nolyfill/side-channel@^1.0.44
  string.prototype.matchall: npm:@nolyfill/string.prototype.matchall@^1.0.44
